<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leakproof Waterproofing | Enquire Now</title>
    <meta name="description" content="Book a waterproofing inspection or request a quote.">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page-shell">
      <section class="hero-card">
        <p class="eyebrow">Leakproof Waterproofing</p>
        <h1>Reliable waterproofing solutions for homes and commercial spaces.</h1>
        <p class="hero-copy">Share your project details and we’ll follow up with the right inspection or quote.</p>
      </section>

      <section class="form-card" aria-labelledby="leadFormTitle">
        <h2 id="leadFormTitle">Request a callback</h2>
        <form id="leadForm" class="lead-form">
          <label>
            <span>Your name</span>
            <input name="name" required placeholder="Rajesh Sharma">
          </label>
          <label>
            <span>Phone</span>
            <input name="phone" required placeholder="+91 98765 43210">
          </label>
          <label>
            <span>Email</span>
            <input name="email" type="email" placeholder="you@example.com">
          </label>
          <label>
            <span>Project type</span>
            <select name="projectType">
              <option>Residential</option>
              <option>Commercial</option>
              <option>Roof / Terrace</option>
              <option>Basement / Leakage</option>
            </select>
          </label>
          <label class="full-width">
            <span>Requirement</span>
            <textarea name="requirement" rows="4" placeholder="Tell us about the issue or the work you need."></textarea>
          </label>
          <button type="submit">Submit enquiry</button>
        </form>

        <div id="formMessage" class="form-message" role="status" aria-live="polite"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
